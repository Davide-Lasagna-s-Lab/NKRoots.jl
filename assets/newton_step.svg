<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">One Newton step of NKRoots.jl</title>
  <desc id="desc">From the point x the Jacobian and the preconditioner are updated, the Arnoldi iteration builds a Krylov space, and the singular value decomposition of its small matrix gives hooksteps. Each hookstep is tried with one residual. A step accepted returns to the top, a step rejected shrinks the radius and returns to the hookstep with no new product.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5f8"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 10" refX="9" refY="5" markerWidth="4.2" markerHeight="3.6" orient="auto-start-reverse">
      <path d="M0 0 L12 5 L0 10 Z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="944" height="404" rx="22" fill="url(#bg)" stroke="#e4e8ee" stroke-width="1.5"/>
  <path d="M230 114 L266 114" fill="none" stroke="#242936" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M460 114 L496 114" fill="none" stroke="#242936" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M690 114 L726 114" fill="none" stroke="#242936" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M825 158 L825 236" fill="none" stroke="#242936" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M730 284 L694 284" fill="none" stroke="#242936" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M500 284 L449 284" fill="none" stroke="#242936" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M285 284 L135 284 L135 162" fill="none" stroke="#389826" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M365 346 L365 382 L825 382 L825 332" fill="none" stroke="#cb3c33" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#head)"/>
  <rect x="40" y="70" width="190" height="88" rx="14" fill="#ffffff" stroke="#98a2b3" stroke-width="3.5"/><text x="135" y="108" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="760" fill="#222734">the point</text><text x="135" y="134" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="560" fill="#4f596b">x, r = F(x)</text>
  <rect x="270" y="70" width="190" height="88" rx="14" fill="#ffffff" stroke="#98a2b3" stroke-width="3.5"/><text x="365" y="108" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="760" fill="#222734">update!</text><text x="365" y="134" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="560" fill="#4f596b">J and M move to x</text>
  <rect x="500" y="70" width="190" height="88" rx="14" fill="#ffffff" stroke="#4063d8" stroke-width="3.5"/><text x="595" y="108" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="760" fill="#222734">Arnoldi on J M⁻¹</text><text x="595" y="134" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="560" fill="#4f596b">one product a vector</text>
  <rect x="730" y="70" width="190" height="88" rx="14" fill="#ffffff" stroke="#9558b2" stroke-width="3.5"/><text x="825" y="108" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="760" fill="#222734">SVD of H</text><text x="825" y="134" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="560" fill="#4f596b">H = U D Vᵀ</text>
  <rect x="730" y="240" width="190" height="88" rx="14" fill="#ffffff" stroke="#9558b2" stroke-width="3.5"/><text x="825" y="278" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="760" fill="#222734">hookstep</text><text x="825" y="304" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="560" fill="#4f596b">μ from ‖s(μ)‖ = Δ</text>
  <rect x="500" y="240" width="190" height="88" rx="14" fill="#ffffff" stroke="#389826" stroke-width="3.5"/><text x="595" y="278" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="760" fill="#222734">trial</text><text x="595" y="304" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="560" fill="#4f596b">F(x + δ) and ρ</text>
  <path d="M365 222 L445 284 L365 346 L285 284 Z" fill="#ffffff" stroke="#cb3c33" stroke-width="3.5" stroke-linejoin="round"/><text x="365" y="291" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#222734">ρ &gt; eta ?</text>
  <text x="135" y="52" text-anchor="middle" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#4f596b">✓ stop when ‖r‖ &lt; tol</text>
  <text x="150" y="272" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#389826">yes: accept x + δ,</text>
  <text x="150" y="306" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#389826">update Δ</text>
  <text x="387" y="372" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#cb3c33">no: Δ becomes Δ/4, a new hookstep, no product with J</text>
  <rect x="40" y="380" width="22" height="14" rx="4" fill="#ffffff" stroke="#4063d8" stroke-width="3"/><text x="70" y="392" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4f596b">products with J</text>
  <rect x="40" y="358" width="22" height="14" rx="4" fill="#ffffff" stroke="#389826" stroke-width="3"/><text x="70" y="370" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4f596b">one residual</text>
  <rect x="40" y="336" width="22" height="14" rx="4" fill="#ffffff" stroke="#9558b2" stroke-width="3"/><text x="70" y="348" text-anchor="start" font-family="Inter, Avenir, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4f596b">small dense algebra</text>
</svg>
